databases:
  - name: archive-db
    plan: basic-256mb
    postgresMajorVersion: "17"
services:
  - type: web
    name: archive
    runtime: image
    image:
      url: ghcr.io/inixiative/archive:latest
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: ARCHIVE_SERVER_TOKEN
        generateValue: true
      - key: PORT
        value: "4700"
      - key: DATABASE_URL
        fromDatabase:
          name: archive-db
          property: connectionString
