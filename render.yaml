services:
  - type: web
    name: archive
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: off
    disk:
      name: archive-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ARCHIVE_SERVER_TOKEN
        generateValue: true
      - key: PORT
        value: "4411"
